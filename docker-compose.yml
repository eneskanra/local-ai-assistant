services:
  postgres:
    image: postgres:17
    container_name: local-ai-postgres
    restart: unless-stopped
    # Değerler aynı klasördeki .env dosyasından okunur
    environment:
      POSTGRES_DB: salesdb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env içinde tanımlı olmalı}
      READER_PASSWORD: ${READER_PASSWORD:?READER_PASSWORD .env içinde tanımlı olmalı}
      MEMORY_PASSWORD: ${MEMORY_PASSWORD:?MEMORY_PASSWORD .env içinde tanımlı olmalı}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Init dosyaları alfabetik sırayla çalışır: önce tablolar, sonra kullanıcı
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ./db/02_create_reader.sh:/docker-entrypoint-initdb.d/02_create_reader.sh:ro
      - ./db/03_create_memory.sh:/docker-entrypoint-initdb.d/03_create_memory.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d salesdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
